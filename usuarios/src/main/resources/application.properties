spring.application.name=usuarios
server.port=8081
spring.main.banner-mode=off

spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:usuarios.db
spring.datasource.username=
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

security.jwt.secret=usuarios-main-secret-change-me-in-production
security.jwt.expiration-minutes=60

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# ---------------------------------------------------------------
# Observabilidad (Evaluacion Parcial 3)
# ---------------------------------------------------------------
# Actuator expone solo lo necesario: salud (sondas de Kubernetes y Docker),
# info y las metricas en formato Prometheus. Sin detalle de salud.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Toda metrica lleva la etiqueta application=<nombre>, para filtrar por servicio en Grafana
management.metrics.tags.application=${spring.application.name}

# Histograma de latencia HTTP (habilita percentiles p95/p99 con histogram_quantile)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s