services:
 
  usuarios-api:
    image: ghcr.io/${NAMESPACE_LC:?falta NAMESPACE_LC}/devops_007d_ols/usuarios:${IMAGE_TAG:-latest}
    container_name: usuarios-api
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/usuarios.db
      SECURITY_JWT_SECRET: ${USUARIOS_JWT_SECRET:-usuarios-main-secret-change-me-in-production}
    volumes:
      - usuarios-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
 
  artelab-api:
    image: ghcr.io/${NAMESPACE_LC:?falta NAMESPACE_LC}/devops_007d_ols/artelab:${IMAGE_TAG:-latest}
    container_name: artelab-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/artelab.db
      USUARIOS_SERVICE_BASE_URL: http://usuarios-api:8081
      SECURITY_JWT_SECRET: ${ARTELAB_JWT_SECRET:-artelab-main-secret-change-me-in-production}
      SECURITY_AUTH_USERNAME: ${ADMIN_USER:-admin}
      SECURITY_AUTH_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - artelab-data:/data
    depends_on:
      usuarios-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
 
volumes:
  artelab-data:
  usuarios-data: