name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test-usuarios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./usuarios
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo de git

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: usuarios/pom.xml

      - name: Dar permiso de ejecucion al wrapper de Maven
        run: chmod +x mvnw

      # verify (no test): ejecuta las pruebas Y genera el reporte de cobertura JaCoCo
      - name: Ejecutar pruebas unitarias y cobertura (JaCoCo)
        run: ./mvnw -B clean verify

      # SonarCloud va justo despues de las pruebas: necesita el reporte de JaCoCo ya generado
      - name: Run SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Token de SonarCloud desde Secrets
        run: |
          ./mvnw -B sonar:sonar \
            -Dsonar.projectKey=TU_ORGANIZACION_usuarios \
            -Dsonar.organization=TU_ORGANIZACION \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/maven@master
        with:
          command: test
          args: --file=usuarios/pom.xml
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Run Snyk monitor to take and send snapshot
        uses: snyk/actions/maven@master
        with:
          command: monitor
          args: --file=usuarios/pom.xml
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Publicar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: usuarios-test-results
          path: usuarios/target/surefire-reports/

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: usuarios-jacoco-report
          path: usuarios/target/site/jacoco/

  test-artelab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./artelab
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo de git

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          java-version: "25"
