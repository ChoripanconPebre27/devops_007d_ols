name: CI Pipeline

# Pipeline con observabilidad y cumplimiento (Evaluacion Parcial 3).
#
#   push / PR a develop o main
#     ├── compliance (auditoria como codigo + gitleaks) ─┐
#     ├── test-usuarios (Snyk, pruebas, JaCoCo, Sonar) ──┼── build-docker (build + Trivy + push) ── deploy-k8s (minikube + Istio)
#     └── test-artelab  (Snyk, pruebas, JaCoCo, Sonar) ──┘
#
# Cualquier control en rojo DETIENE el pipeline: los jobs siguientes quedan omitidos (skipped).

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # gitleaks revisa el historial de commits

      - name: Auditoria de cumplimiento (politicas como codigo)
        run: ./scripts/audit-compliance.sh

      - name: Busqueda de secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-usuarios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./usuarios
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # CONTROL DE SEGURIDAD BLOQUEANTE: una vulnerabilidad CRITICA en dependencias detiene el pipeline.
      - name: Snyk - vulnerabilidades en dependencias (bloquea si hay criticas)
        uses: snyk/actions/maven@master
        with:
          command: test
          args: --file=usuarios/pom.xml --severity-threshold=critical
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk monitor (snapshot para vigilar las dependencias en el tiempo)
        if: ${{ !cancelled() }}
        uses: snyk/actions/maven@master
        with:
          command: monitor
          args: --file=usuarios/pom.xml
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: usuarios/pom.xml

      - name: Dar permiso de ejecucion al wrapper de Maven
        run: chmod +x mvnw

      # GATE DE CALIDAD: pruebas + cobertura de lineas >= 80% (JaCoCo). Si falla, se detiene el pipeline.
      - name: Ejecutar pruebas unitarias y cobertura (JaCoCo)
        run: ./mvnw -B clean verify

      - name: Metricas del CI (cobertura y pruebas) para el dashboard
        if: always()
        working-directory: .
        run: ./scripts/ci-metrics.sh usuarios | tee ci-metrics-usuarios.prom

      # GATE DE CALIDAD: SonarCloud espera el Quality Gate y falla el job si no se cumple.
      - name: SonarCloud (espera el Quality Gate)
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_U }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=devops-grupo7_sonar-usuarios \
            -Dsonar.organization=devops-grupo7 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=true

      - name: Publicar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: usuarios-test-results
          path: usuarios/target/surefire-reports/

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: usuarios-jacoco-report
          path: usuarios/target/site/jacoco/

      - name: Publicar metricas del CI
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-metrics-usuarios
          path: ci-metrics-usuarios.prom

  test-artelab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./artelab
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # CONTROL DE SEGURIDAD BLOQUEANTE: una vulnerabilidad CRITICA en dependencias detiene el pipeline.
      - name: Snyk - vulnerabilidades en dependencias (bloquea si hay criticas)
        uses: snyk/actions/maven@master
        with:
          command: test
          args: --file=artelab/pom.xml --severity-threshold=critical
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk monitor (snapshot para vigilar las dependencias en el tiempo)
        if: ${{ !cancelled() }}
        uses: snyk/actions/maven@master
        with:
          command: monitor
          args: --file=artelab/pom.xml
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: artelab/pom.xml

      - name: Dar permiso de ejecucion al wrapper de Maven
        run: chmod +x mvnw

      # GATE DE CALIDAD: pruebas + cobertura de lineas >= 80% (JaCoCo). Si falla, se detiene el pipeline.
      - name: Ejecutar pruebas unitarias y cobertura (JaCoCo)
        run: ./mvnw -B clean verify

      - name: Metricas del CI (cobertura y pruebas) para el dashboard
        if: always()
        working-directory: .
        run: ./scripts/ci-metrics.sh artelab | tee ci-metrics-artelab.prom

      # GATE DE CALIDAD: SonarCloud espera el Quality Gate y falla el job si no se cumple.
      - name: SonarCloud (espera el Quality Gate)
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_A }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=devops-grupo7_sonar-artelab \
            -Dsonar.organization=devops-grupo7 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.qualitygate.wait=true

      - name: Publicar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: artelab-test-results
          path: artelab/target/surefire-reports/

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: artelab-jacoco-report
          path: artelab/target/site/jacoco/

      - name: Publicar metricas del CI
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-metrics-artelab
          path: ci-metrics-artelab.prom

  build-docker:
    name: Build, escaneo y publicacion de imagenes
    needs: [compliance, test-usuarios, test-artelab]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clonar codigo
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalizar nombre de imagen a minusculas
        run: echo "NAMESPACE_LC=${NAMESPACE,,}" >> $GITHUB_ENV
        env:
          NAMESPACE: ${{ github.repository_owner }}

      # CONTROL DE SEGURIDAD BLOQUEANTE: se construye la imagen y se escanea ANTES de publicarla.
      # Una vulnerabilidad CRITICA con correccion disponible detiene el pipeline (exit-code 1).
      - name: Construir imagenes para escanear
        run: |
          docker build -t scan/usuarios:${{ github.sha }} ./usuarios
          docker build -t scan/artelab:${{ github.sha }} ./artelab

      - name: Escaneo Trivy de las imagenes (bloquea si hay criticas)
        run: |
          for svc in usuarios artelab; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
              image --severity CRITICAL --ignore-unfixed --exit-code 1 scan/${svc}:${{ github.sha }}
          done

      - name: Build and Push Usuarios
        uses: docker/build-push-action@v7
        with:
          context: ./usuarios
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.NAMESPACE_LC }}/devops_007d_ols/usuarios:latest
            ghcr.io/${{ env.NAMESPACE_LC }}/devops_007d_ols/usuarios:${{ github.sha }}

      - name: Build and Push Artelab
        uses: docker/build-push-action@v7
        with:
          context: ./artelab
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.NAMESPACE_LC }}/devops_007d_ols/artelab:latest
            ghcr.io/${{ env.NAMESPACE_LC }}/devops_007d_ols/artelab:${{ github.sha }}

  deploy-k8s:
    name: Despliegue en Kubernetes (minikube + Istio) con las imagenes publicadas
    needs: build-docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    env:
      ISTIO_VERSION: "1.26.2"
      ISTIO_PROFILE: default      # sin egress gateway: usa menos recursos en el runner
      ADDONS: prometheus          # en el runner solo hace falta Prometheus
    steps:
      - name: Clonar codigo
        uses: actions/checkout@v5

      - name: Iniciar minikube
        uses: medyagh/setup-minikube@latest
        with:
          cpus: 2
          memory: 6000m

      - name: Instalar istioctl
        run: |
          curl -sL https://istio.io/downloadIstio | ISTIO_VERSION=$ISTIO_VERSION sh -
          echo "$PWD/istio-$ISTIO_VERSION/bin" >> $GITHUB_PATH

      - name: Instalar Istio y Prometheus en el cluster
        run: ./scripts/01-cluster.sh

      - name: Normalizar nombre de imagen a minusculas
        run: echo "NAMESPACE_LC=${NAMESPACE,,}" >> $GITHUB_ENV
        env:
          NAMESPACE: ${{ github.repository_owner }}

      - name: Cargar en minikube las imagenes publicadas (mismo SHA del commit)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          for svc in usuarios artelab; do
            img=ghcr.io/${NAMESPACE_LC}/devops_007d_ols/${svc}:${{ github.sha }}
            docker pull "$img"
            docker tag "$img" "artelab-${svc}:ci"
            minikube image load "artelab-${svc}:ci"
          done
          echo "ci" > .last-tag

      - name: Desplegar (mide el tiempo de despliegue)
        run: |
          START=$(date +%s)
          ./scripts/04-deploy.sh --sin-build
          echo "DEPLOY_SECONDS=$(( $(date +%s) - START ))" >> $GITHUB_ENV

      - name: Verificar politicas de seguridad en el cluster
        run: |
          kubectl -n istio-system port-forward svc/istio-ingressgateway 8080:80 >/dev/null 2>&1 &
          sleep 5
          ./scripts/verify-policies.sh

      - name: Verificar que las metricas de la app llegan al sidecar (merge de Istio)
        run: |
          kubectl -n artelab exec deploy/usuarios -c istio-proxy -- \
            curl -s localhost:15020/stats/prometheus | grep -c '^jvm_memory_used_bytes' | grep -vq '^0$'

      - name: Mostrar logs si el despliegue falla
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n artelab describe pods || true
          kubectl -n artelab logs -l app --all-containers --tail=100 || true

      - name: Descargar metricas de los jobs de prueba
        if: always()
        uses: actions/download-artifact@v5
        with:
          pattern: ci-metrics-*
          path: metrics
          merge-multiple: true

      - name: Consolidar metricas del CI/CD
        if: always()
        run: |
          cat metrics/*.prom > ci-metrics.prom 2>/dev/null || true
          if [ -n "${DEPLOY_SECONDS:-}" ]; then
            echo "ci_deploy_duration_seconds ${DEPLOY_SECONDS}" >> ci-metrics.prom
            echo "ci_last_deploy_timestamp_seconds $(date +%s)" >> ci-metrics.prom
          fi
          { echo "### Metricas del pipeline"; echo '```'; cat ci-metrics.prom; echo '```'; } >> $GITHUB_STEP_SUMMARY

      - name: Publicar metricas consolidadas (se importan al dashboard con scripts/push-ci-metrics.sh)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-metrics
          path: ci-metrics.prom
