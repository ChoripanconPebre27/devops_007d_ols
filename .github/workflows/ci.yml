name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test-usuarios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./usuarios
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v5

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: usuarios/pom.xml

      - name: Dar permiso de ejecucion al wrapper de Maven
        run: chmod +x mvnw

      - name: Ejecutar pruebas unitarias
        run: ./mvnw -B clean test

      - name: Publicar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: usuarios-test-results
          path: usuarios/target/surefire-reports/

  test-artelab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./artelab
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v5

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: artelab/pom.xml

      - name: Dar permiso de ejecucion al wrapper de Maven
        run: chmod +x mvnw

      - name: Ejecutar pruebas unitarias
        run: ./mvnw -B clean test

      - name: Publicar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: artelab-test-results
          path: artelab/target/surefire-reports/

  build-docker:
    name: Build and Push Docker Images
    needs: [test-usuarios, test-artelab]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clonar codigo
        uses: actions/checkout@v5
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}      
      - name: Normalizar nombre de imagen
        run: |
          echo: "NAMESPACE_LC=${NAMESPACE,,}" >> ${GITHUB_ENV}
        env:
          NAMESPACE: ${{ github.repository_owner }}
      - name: Build and Push Usuarios
        uses: docker/build-push-action@v7
        with:
          context: ./usuarios
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${ env.NAMESPACE_LC }/devops_007d_ols/usuarios:latest

      - name: Build and Push ArteLab
        uses: docker/build-push-action@v7
        with:
          context: ./artelab
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${ env.NAMESPACE_LC }/devops_007d_ols/usuarios:latest