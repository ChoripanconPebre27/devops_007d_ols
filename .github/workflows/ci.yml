name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test-usuarios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./usuarios
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: usuarios/pom.xml

      - name: Dar permiso de ejecucion al wrapper de Maven
        run: chmod +x mvnw

      - name: Ejecutar pruebas unitarias
        run: ./mvnw -B clean test

      - name: Publicar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usuarios-test-results
          path: usuarios/target/surefire-reports/

  test-artelab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./artelab
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: artelab/pom.xml

      - name: Dar permiso de ejecucion al wrapper de Maven
        run: chmod +x mvnw

      - name: Ejecutar pruebas unitarias
        run: ./mvnw -B clean test

      - name: Publicar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artelab-test-results
          path: artelab/target/surefire-reports/
