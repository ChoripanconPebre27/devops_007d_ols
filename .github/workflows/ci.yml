name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test-usuarios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./usuarios
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/maven@master
        with:
          command: test
          args: --file=usuarios/pom.xml --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Alerta de seguridad si Snyk encontro vulnerabilidades
        if: steps.snyk-test.outcome == 'failure'
        run: |
          echo: "::warning title=Snyk (usuarios)::Se encontraron vulnerabilidades de severidad alta o critica. Reviso el paso Run Snyk to check for vulnerabilities."
          echo: "### Alerta de seguridad (usuarios): Snyk encontro vulnerabilidades altas o criticas" >> $GITHUB_STEP_SUMMARY

      - name: Run Snyk monitor to take and send snapshot
        if: ${{ !cancelled() }}
        uses: snyk/actions/maven@master
        with:
          command: monitor
          args: --file=usuarios/pom.xml
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: usuarios/pom.xml

      - name: Dar permiso de ejecucion al wrapper de Maven
        run: chmod +x mvnw

      - name: Ejecutar pruebas unitarias y cobertura (JaCoCo)
        run: ./mvnw -B clean verify

      - name: Run SonarCloud Analysis
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_U }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=devops-grupo7_sonar-usuarios \
            -Dsonar.organization=devops-grupo7 \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Publicar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: usuarios-test-results
          path: usuarios/target/surefire-reports/

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: usuarios-jacoco-report
          path: usuarios/target/site/jacoco/

  test-artelab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./artelab
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/maven@master
        with:
          command: test
          args: --file=artelab/pom.xml --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
      
      - name: Alerta de seguridad si Snyk encontro vulnerabilidades
        if: steps.snyk-test.outcome == 'failure'
        run: |
          echo: "::warning title=Snyk (artelab)::Se encontraron vulnerabilidades de severidad alta o critica. Reviso el paso Run Snyk to check for vulnerabilities."
          echo: "### Alerta de seguridad (artelab): Snyk encontro vulnerabilidades altas o criticas" >> $GITHUB_STEP_SUMMARY

      - name: Run Snyk monitor to take and send snapshot
        if: ${{ !cancelled() }}
        uses: snyk/actions/maven@master
        with:
          command: monitor
          args: --file=artelab/pom.xml
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: artelab/pom.xml

      - name: Dar permiso de ejecucion al wrapper de Maven
        run: chmod +x mvnw

      - name: Ejecutar pruebas unitarias y cobertura (JaCoCo)
        run: ./mvnw -B clean verify

      - name: Run SonarCloud Analysis
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_A }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=devops-grupo7_sonar-artelab \
            -Dsonar.organization=devops-grupo7 \
            -Dsonar.host.url=https://sonarcloud.io

      - name: Publicar resultados de las pruebas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: artelab-test-results
          path: artelab/target/surefire-reports/

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: artelab-jacoco-report
          path: artelab/target/site/jacoco/

  build-docker:
    name: Build and Push Docker Images
    needs: [test-usuarios, test-artelab]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clonar codigo
        uses: actions/checkout@v5
 
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
 
      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Normalizar nombre de imagen a minusculas
        run: echo "NAMESPACE_LC=${NAMESPACE,,}" >> $GITHUB_ENV
        env:
          NAMESPACE: ${{ github.repository_owner }}
 
      - name: Build and Push Usuarios
        uses: docker/build-push-action@v7
        with:
          context: ./usuarios
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.NAMESPACE_LC }}/devops_007d_ols/usuarios:latest
            ghcr.io/${{ env.NAMESPACE_LC }}/devops_007d_ols/usuarios:${{ github.sha }}
 
      - name: Build and Push Artelab
        uses: docker/build-push-action@v7
        with:
          context: ./artelab
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.NAMESPACE_LC }}/devops_007d_ols/artelab:latest
            ghcr.io/${{ env.NAMESPACE_LC }}/devops_007d_ols/artelab:${{ github.sha }}
  
  deploy:
    name: Deploy to simulated environment
    needs: build-docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_FILE: docker-compose.deploy.yml
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Clonar codigo
        uses: actions/checkout@v5
 
      - name: Normalizar nombre de imagen a minusculas
        run: echo "NAMESPACE_LC=${NAMESPACE,,}" >> $GITHUB_ENV
        env:
          NAMESPACE: ${{ github.repository_owner }}
 
      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Descargar las imagenes publicadas
        run: docker compose pull
 
      - name: Desplegar y esperar a que los servicios esten healthy
        run: docker compose up -d --wait
 
      - name: Estado de los contenedores
        run: docker compose ps
 
      - name: Smoke test (health de ambos servicios)
        run: |
          curl -fsS http://localhost:8081/actuator/health | grep -q '"status":"UP"'
          curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'
 
      - name: Mostrar logs si el despliegue falla
        if: failure()
        run: docker compose logs --no-color
 
      - name: Destruir el entorno simulado
        if: always()
        run: docker compose down -v